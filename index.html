<!doctype html>
<!-- 
  index.html — App Entry Point
  This is the single HTML file served by Vite for the entire React app (SPA).
  - charset UTF-8 ensures proper text encoding.
  - viewport meta tag makes the app responsive on mobile devices.
  - favicon.svg sets the browser tab icon.
  - The <div id="root"> is where React mounts the entire application via main.jsx.
  - The script tag loads main.jsx as a module, which bootstraps the React app.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hope, Inc. SMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
